<!DOCTYPE html>
<html lang="ca">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Editor lliure — LogoCat</title>
<meta name="description" content="Editor lliure de LogoCat: escriu ordres, defineix procediments i mira com la tortuga els dibuixa.">
<link rel="icon" href="img/logo.svg" type="image/svg+xml">
<link rel="stylesheet" href="css/logocat.css">
<script>
// Tema abans de pintar, per evitar el parpelleig.
(function () {
  var t = null;
  try { t = localStorage.getItem('logocat-tema'); } catch (e) {}
  if (!t) t = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
  document.documentElement.dataset.theme = t;
})();
</script>
<script type="module" src="js/ui/editor.js"></script>
</head>
<body class="pagina-editor">

<header class="barra">
  <a class="barra-logo" href="index.html">
    <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="1" y="1" width="22" height="22" rx="4" fill="#2b2d31"/><polygon points="12,5 6,18 18,18" fill="none" stroke="#f2f2ee" stroke-width="1.6" stroke-linejoin="round"/></svg>
    LogoCat
  </a>
  <nav class="barra-nav" aria-label="Seccions">
    <a href="index.html">Capítols</a>
    <a href="simulador.html" aria-current="page">Editor lliure</a>
  </nav>
  <div class="eines-velocitat">
    <label for="velocitat">Velocitat:</label>
    <input id="velocitat" type="range" min="1" max="6" step="1" value="3">
  </div>
  <span class="barra-espai"></span>
  <div class="eines-estat">
    <span>Orientació: <strong id="e-orientacio">0°</strong></span>
    <span>Llapis: <strong id="e-llapis">a baix</strong></span>
    <span>Color: <strong id="e-color">blanc</strong></span>
  </div>
  <span class="estat" id="estat" data-estat="apunt"><i></i><span>a punt</span></span>
  <button class="boto boto--icona" id="boto-tema" type="button" aria-label="Canvia el tema">
    <svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/></svg>
  </button>
</header>

<main class="editor">
  <section class="panell" aria-label="Procediments">
    <div class="panell-cap">
      <h1>Procediments</h1>
      <span id="desat">desat</span>
    </div>
    <div class="panell-codi">
      <pre class="numeros" id="numeros" aria-hidden="true">1</pre>
      <div class="pila">
        <pre class="capa" id="capa" aria-hidden="true"></pre>
        <textarea id="procediments" spellcheck="false" autocomplete="off" autocapitalize="characters" wrap="off"
          aria-label="Procediments: escriu-hi els teus PROC … FI"
          placeholder="Aquí van els teus procediments. Per exemple:

PROC QUADRAT
  REPETEIX 4 [AVANÇA 50 GIRA.D 90]
FI"></textarea>
      </div>
    </div>
    <p class="panell-avis" id="avis" role="status" hidden></p>
    <div class="pas-info" id="pas-info" hidden>
      <h2>Pas a pas</h2>
      <dl>
        <dt>Ara farà</dt><dd id="pas-ara"></dd>
        <dt>On som</dt><dd id="pas-on"></dd>
        <dt id="pas-valors-etq">Valors</dt><dd id="pas-valors-fila"><span id="pas-valors"></span></dd>
      </dl>
    </div>
  </section>
  <section class="pantalla" aria-label="Pantalla de la tortuga">
    <div id="monitor"></div>
  </section>
  <aside class="botons" aria-label="Controls">
    <button class="boto boto--gran" id="b-pas" type="button">Pas</button>
    <button class="boto boto--gran" id="b-continua" type="button" hidden>Continua</button>
    <button class="boto boto--gran" id="b-atura" type="button" aria-disabled="true">Atura</button>
    <button class="boto" id="b-desfes" type="button">Desfés</button>
    <button class="boto" id="b-reinicia" type="button">Reinicia</button>
  </aside>
</main>

</body>
</html>
